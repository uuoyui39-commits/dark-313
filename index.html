<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ملزمة فيزياء السادس العلمي — الكتاب التفاعلي 001</title>
<style>
:root{--gold:#d9a441}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#4a3626,#1d140e 70%);color:#f3e8d6;font-family:Tahoma,"Segoe UI",Arial,sans-serif}
header{padding:14px 16px 6px;text-align:center}
header h1{margin:0;font-size:clamp(16px,2.6vw,22px);color:var(--gold)}
header p{margin:4px 0 0;font-size:13px;opacity:.8}
.stage{display:flex;justify-content:center;padding:10px 12px;}
.book{width:min(96vw,850px);background:#3a2a1d;border-radius:14px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.05)}
.pdf-container{position:relative;background:#f6efe3;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 15px rgba(0,0,0,.3);height:75vh;width:100%;}
.pdf-container iframe{width:100%;height:100%;border:none;}
.labcard{margin-top:14px;background:#2a1f16;border:1px solid #6b4f36;border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;line-height:1.7}
.lab{display:inline-block;background:linear-gradient(#e6b858,#b9852b);color:#2a1b07;padding:10px 18px;border-radius:10px;font-weight:bold;text-decoration:none;white-space:nowrap}
.hint{text-align:center;font-size:12px;opacity:.7;margin:10px 0 10px}
</style>
</head>
<body>
<header>
  <h1>ملزمة فيزياء السادس العلمي — الفصل الأول: المتسعات</h1>
  <p>الدفعة 001 · ملازم دار الكنز</p>
</header>

<div class="stage">
  <div class="book">
    <!-- إطار عرض ملف الـ PDF مباشرة -->
    <div class="pdf-container">
      <iframe src="book.pdf" title="ملزمة الفيزياء"></iframe>
    </div>

    <!-- بطاقة التجربة التفاعلية -->
    <div class="labcard">
       المختبر التفاعلي:<br>
      <b>التجربة 1: تأثير إدخال العازل الكهربائي بين صفيحتي متسعة مشحونة ومفصولة عن البطارية (تجربة فاراداي)</b>
      <a class="lab" href="experiment_001.html">فتح التجربة 3D</a>
    </div>

    <div class="hint">يمكنك التمرير داخل الملزمة وقراءة الصفحات بكل سهولة من الموبايل.</div>
  </div>
</div>
</body>
</html>
