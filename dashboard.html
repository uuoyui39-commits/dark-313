<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - المدير</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 font-['Cairo'] min-h-screen">

    <!-- Auth Modal / Login -->
    <div id="auth-modal" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-violet-500/30 rounded-2xl max-w-md w-full p-8 shadow-2xl shadow-violet-500/10">
            <div class="w-12 h-12 bg-violet-500/10 rounded-xl flex items-center justify-center mb-6 text-violet-400 text-xl font-bold border border-violet-500/30">🔐</div>
            <h2 class="text-2xl font-bold mb-2 text-violet-400">لوحة تحكم المدير</h2>
            <p class="text-slate-400 text-sm mb-6">سجل الدخول بالبريد الإلكتروني وكلمة المرور الخاصة بالمدير.</p>
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">البريد الإلكتروني</label>
                    <input type="email" id="email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-violet-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">كلمة المرور</label>
                    <input type="password" id="password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-violet-500 transition">
                </div>
                <button type="submit" class="w-full bg-violet-600 hover:bg-violet-500 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg shadow-violet-600/30">تسجيل الدخول</button>
            </form>
        </div>
    </div>

    <!-- Dashboard Content -->
    <div id="dashboard-content" class="hidden min-h-screen flex flex-col">
        <header class="bg-slate-900 border-b border-slate-800 h-16 px-6 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <h1 class="font-bold text-lg text-violet-400">لوحة الإدارة والمتابعة</h1>
                <span class="px-2 py-0.5 rounded-full bg-violet-500/10 text-violet-400 text-xs">مدير النظام</span>
            </div>
            <div class="flex items-center gap-4">
                <a href="index.html" class="text-xs text-slate-400 hover:text-white transition">عرض الموقع الرئيسي 🌐</a>
                <button onclick="logout()" class="px-3 py-1.5 bg-red-500/10 text-red-400 border border-red-500/30 rounded-xl text-xs font-semibold hover:bg-red-500/20 transition">تسجيل الخروج</button>
            </div>
        </header>

        <main class="flex-1 max-w-7xl mx-auto px-4 py-8 w-full space-y-8">
            <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                <h3 class="text-lg font-bold text-violet-400 mb-4">➕ إضافة ملزمة جديدة</h3>
                <form id="booklet-form" onsubmit="addBooklet(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">عنوان الملزمة</label>
                        <input type="text" id="b-title" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-violet-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">اسم الأستاذ</label>
                        <input type="text" id="b-teacher" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-violet-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">المادة الدراسية</label>
                        <input type="text" id="b-subject" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-violet-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">المرحلة الدراسية</label>
                        <select id="b-stage" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-violet-500">
                            <option>السادس الإعدادي - العلمي (إحيائي/تطبيقي)</option>
                            <option>السادس الإعدادي - الأدبي</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-slate-300 mb-1">وصف مختصر</label>
                        <textarea id="b-desc" rows="2" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-violet-500"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">رابط ملف PDF</label>
                        <input type="url" id="b-pdf" placeholder="https://..." required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-violet-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">رابط صورة الغلاف (اختياري)</label>
                        <input type="url" id="b-cover" placeholder="https://..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-violet-500">
                    </div>
                    <div class="md:col-span-2">
                        <button type="submit" class="w-full bg-violet-600 hover:bg-violet-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-violet-600/30">نشر الملزمة الآن 🚀</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script type="module" src="dashboard.js"></script>
</body>
</html>
